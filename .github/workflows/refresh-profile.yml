name: Refresh profile artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_profile.py'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'mk8288/mk8288'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned after source lookup
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Refresh artwork from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile.py

      - name: Commit changed artwork only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/ data/github-public.json
          if git diff --cached --quiet; then
            printf '%s\n' 'No artwork changes.'
            exit 0
          fi
          git commit -m 'Refresh public profile artwork [skip ci]'
          git push origin HEAD:main
