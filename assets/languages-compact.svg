<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
<title id="title">Primary repository languages</title><desc id="desc">Python: 4 repositories, HTML: 3 repositories, JavaScript: 1 repositories, TypeScript: 1 repositories</desc>
<style>
