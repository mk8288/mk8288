<svg xmlns="http://www.w3.org/2000/svg" width="480" height="348" viewBox="0 0 480 348" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Kaif | Security engineer and CTF creator</title><desc id="desc">Animated console header. MSc Security and Resilience at Imperial College London, 2026–2027.</desc>
<style>
:root{--bg:#F6F8FA;--surface:#FFFFFF;--border:#CBD5E1;--fg:#182434;--muted:#526171;--accent:#096B80;--mint:#16704B;--grid:#E2E8F0}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--surface:#161D27;--border:#303B49;--fg:#F0F6FC;--muted:#AAB8C7;--accent:#64D8ED;--mint:#72E1B3;--grid:#233043}}
.bg{fill:var(--bg)}.surface{fill:var(--surface)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.mint{fill:var(--mint)}.border{stroke:var(--border)}
@keyframes type{0%{width:0}16%,92%{width:100%}100%{width:0}}.reveal{animation:type 14s steps(50,end) infinite}@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}}.cursor{animation:blink 1.6s step-end infinite}@media(prefers-reduced-motion:reduce){.packet{display:none}.reveal{width:100%}.cursor{opacity:1}}
