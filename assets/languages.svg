<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-labelledby="title desc">
<title id="title">Primary repository languages</title><desc id="desc">Python: 3 repositories, HTML: 3 repositories, JavaScript: 1 repositories, TypeScript: 1 repositories</desc>
<style>
:root{--bg:#F6F8FA;--surface:#FFFFFF;--border:#CBD5E1;--fg:#182434;--muted:#526171;--accent:#096B80;--mint:#16704B;--grid:#E2E8F0}
@media(prefers-color-scheme:dark){:root{--bg:#0D1117;--surface:#161D27;--border:#303B49;--fg:#F0F6FC;--muted:#AAB8C7;--accent:#64D8ED;--mint:#72E1B3;--grid:#233043}}
.bg{fill:var(--bg)}.surface{fill:var(--surface)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.mint{fill:var(--mint)}.border{stroke:var(--border)}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="999" height="199" rx="16" class="surface border" fill="none"/><text x="36" y="38" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="400" class="accent" letter-spacing="1">PRIMARY LANGUAGES / NON-FORK PUBLIC REPOSITORIES</text><rect x="36.000" y="69" width="348.000" height="14" rx="3" fill="#096B80"/><circle cx="41" cy="119" r="5" fill="#096B80"/><text x="55" y="124" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="400" class="fg" >Python · 3</text><rect x="384.000" y="69" width="348.000" height="14" rx="3" fill="#25947E"/><circle cx="225" cy="119" r="5" fill="#25947E"/><text x="239" y="124" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="400" class="fg" >HTML · 3</text><rect x="732.000" y="69" width="116.000" height="14" rx="3" fill="#7175CB"/><circle cx="409" cy="119" r="5" fill="#7175CB"/><text x="423" y="124" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="400" class="fg" >JavaScript · 1</text><rect x="848.000" y="69" width="116.000" height="14" rx="3" fill="#A17927"/><circle cx="593" cy="119" r="5" fill="#A17927"/><text x="607" y="124" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="400" class="fg" >TypeScript · 1</text><text x="36" y="171" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="400" class="muted" >Repository counts, not skill ratings.</text></svg>